name: Build Stable v2.2.0 Packages
# source: stable-v2.2.0 / RPCN Direct

on:
  push:
    branches:
      - stable-v2.2.0
    paths:
      - ".github/workflows/build-guest-package.yml"
      - "Host/**"
      - "Guest/**"
      - "local_rpcn/**"
      - "local_patch/**"
      - "VERSION.txt"
      - "README_PL.txt"
      - "RELEASE_NOTES_v2.2.0.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout stable v2.2.0
        uses: actions/checkout@v4
        with:
          ref: stable-v2.2.0

      - name: Build stable v2.2.0 ZIP packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $guestStage = 'package-guest\Patras1993-Tekken-Revolution-Guest-v2.2.0'
          $hostStage = 'package-host\Patras1993-Tekken-Revolution-Host-v2.2.0'

          New-Item -ItemType Directory -Path $guestStage -Force | Out-Null
          New-Item -ItemType Directory -Path $hostStage -Force | Out-Null

          Copy-Item 'Guest\*' $guestStage -Recurse -Force
          Copy-Item 'VERSION.txt' $guestStage -Force
          Copy-Item 'RELEASE_NOTES_v2.2.0.txt' $guestStage -Force

          Copy-Item 'Host' $hostStage -Recurse -Force
          Copy-Item 'local_patch' $hostStage -Recurse -Force
          Copy-Item 'local_rpcn' $hostStage -Recurse -Force
          Copy-Item 'README_PL.txt' $hostStage -Force
          Copy-Item 'VERSION.txt' $hostStage -Force
          Copy-Item 'RELEASE_NOTES_v2.2.0.txt' $hostStage -Force

          $guestZip = 'Patras1993-Tekken-Revolution-Guest-v2.2.0.zip'
          $hostZip = 'Patras1993-Tekken-Revolution-Host-v2.2.0.zip'

          Compress-Archive -Path 'package-guest\*' -DestinationPath $guestZip -CompressionLevel Optimal -Force
          Compress-Archive -Path 'package-host\*' -DestinationPath $hostZip -CompressionLevel Optimal -Force

          $guestEntries = tar -tf $guestZip
          $hostEntries = tar -tf $hostZip

          if ($guestEntries -match 'No BTB|tekkenbtb|local_backend|version\.dll|tr_updater') {
            throw 'Guest stable zawiera pozostalosci starej architektury.'
          }
          if ($hostEntries -match 'No BTB|local_backend|version\.dll|tr_updater|modules/tr') {
            throw 'Host stable zawiera pozostalosci starej architektury.'
          }

          if ($hostEntries -notmatch 'local_rpcn/rpcn.exe') {
            throw 'Host stable nie zawiera rpcn.exe.'
          }
          if ($hostEntries -notmatch 'local_rpcn/rpcn_version.txt') {
            throw 'Host stable nie zawiera rpcn_version.txt.'
          }

          Write-Host "Guest ZIP: $((Get-Item $guestZip).Length) bytes"
          Write-Host "Host ZIP: $((Get-Item $hostZip).Length) bytes"

      - name: Upload Guest v2.2.0
        uses: actions/upload-artifact@v4
        with:
          name: Patras1993-Tekken-Revolution-Guest-v2.2.0
          path: Patras1993-Tekken-Revolution-Guest-v2.2.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Host v2.2.0
        uses: actions/upload-artifact@v4
        with:
          name: Patras1993-Tekken-Revolution-Host-v2.2.0
          path: Patras1993-Tekken-Revolution-Host-v2.2.0.zip
          if-no-files-found: error
          retention-days: 30
