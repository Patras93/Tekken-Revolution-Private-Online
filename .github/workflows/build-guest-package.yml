name: Build Stable Packages
# stable-source: v2.1.1-hotfix

on:
  push:
    branches:
      - patras1993-independent-server
    paths:
      - ".github/workflows/build-guest-package.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout stable v2.1.1
        uses: actions/checkout@v4
        with:
          ref: stable-v2.1.1

      - name: Build v2.1.1 ZIP packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $guestStage = 'package-guest\Patras1993-Tekken-Revolution-Guest-v2.1.1'
          $hostStage = 'package-host\Patras1993-Tekken-Revolution-Host-v2.1.1'

          New-Item -ItemType Directory -Path $guestStage -Force | Out-Null
          New-Item -ItemType Directory -Path $hostStage -Force | Out-Null

          Copy-Item 'Guest\*' $guestStage -Recurse -Force
          Copy-Item 'VERSION.txt' $guestStage -Force
          Copy-Item 'RELEASE_NOTES_v2.1.1.txt' $guestStage -Force

          Copy-Item 'Host' $hostStage -Recurse -Force
          Copy-Item 'local_backend' $hostStage -Recurse -Force
          Copy-Item 'local_patch' $hostStage -Recurse -Force
          Copy-Item 'local_rpcn' $hostStage -Recurse -Force
          Copy-Item 'README_PL.txt' $hostStage -Force
          Copy-Item 'VERSION.txt' $hostStage -Force
          Copy-Item 'RELEASE_NOTES_v2.1.1.txt' $hostStage -Force

          $guestZip = 'Patras1993-Tekken-Revolution-Guest-v2.1.1.zip'
          $hostZip = 'Patras1993-Tekken-Revolution-Host-v2.1.1.zip'

          if (Test-Path $guestZip) { Remove-Item $guestZip -Force }
          if (Test-Path $hostZip) { Remove-Item $hostZip -Force }

          Compress-Archive -Path 'package-guest\*' -DestinationPath $guestZip -CompressionLevel Optimal
          Compress-Archive -Path 'package-host\*' -DestinationPath $hostZip -CompressionLevel Optimal

          Write-Host "Guest ZIP: $((Get-Item $guestZip).Length) bytes"
          Write-Host "Host ZIP: $((Get-Item $hostZip).Length) bytes"

          $guestEntries = tar -tf $guestZip
          $hostEntries = tar -tf $hostZip

          if ($guestEntries -match 'P1 Health Shield|Practice Online Health') {
            throw 'Guest ZIP zawiera przestarzale pliki Health.'
          }
          if ($hostEntries -match 'P1 Health Shield|Practice Online Health|Find Revolution P1 Health|Decrypt Revolution EBOOT') {
            throw 'Host ZIP zawiera przestarzale pliki testowe.'
          }

      - name: Upload Guest v2.1.1
        uses: actions/upload-artifact@v4
        with:
          name: Patras1993-Tekken-Revolution-Guest-v2.1.1
          path: Patras1993-Tekken-Revolution-Guest-v2.1.1.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Host v2.1.1
        uses: actions/upload-artifact@v4
        with:
          name: Patras1993-Tekken-Revolution-Host-v2.1.1
          path: Patras1993-Tekken-Revolution-Host-v2.1.1.zip
          if-no-files-found: error
          retention-days: 30
